kb: __APP_NAME__
scenarios:
  - id: G-01
    title: "An adult is 10 days late with no waiver card: 250 cents, under the cap"
    facts:
      days_late: 10
      member_type: adult
      waiver_card: false
    expect:
      goals:
        outcome: fine_due
        amount_due: 250
      line_items:
        cap_deduction: 0
        waiver_deduction: 0
      fires: [RATE-02, FINE-01, CAP-02, CAP-03, CAP-04, WAIV-01, AMT-02, OUT-03]
  - id: G-02
    title: "A child is 100 days late: the cap of 500 cents cuts the fine of 1000"
    facts:
      days_late: 100
      member_type: child
      waiver_card: false
    expect:
      goals:
        outcome: fine_due
        amount_due: 500
      line_items:
        cap_deduction: 500
        waiver_deduction: 0
      fires: [RATE-01, CAP-01, CAP-04, AMT-02, OUT-03]
  - id: G-03
    title: "A senior is 4 days late with a waiver card: the fine of 60 cents is cancelled"
    facts:
      days_late: 4
      member_type: senior
      waiver_card: true
    expect:
      goals:
        outcome: waived
        amount_due: 0
      line_items:
        cap_deduction: 0
        waiver_deduction: 60
      fires: [RATE-03, WAIV-01, AMT-02, OUT-02]
  - id: G-04
    title: "A book returned on time: only the days late are asked, and there is no fine"
    facts:
      days_late: 0
    expect:
      goals:
        outcome: no_fine
        amount_due: 0
      line_items:
        cap_deduction: 0
        waiver_deduction: 0
      fires: [OUT-01, AMT-01]
  - id: G-05
    title: "A late book with no waiver card: the engine still asks for the member type"
    facts:
      days_late: 10
      waiver_card: false
    expect:
      ask: member_type
  - id: G-06
    title: "A late book with a waiver card: the engine still asks for the member type, to show what the card cancels"
    facts:
      days_late: 10
      waiver_card: true
    expect:
      ask: member_type
