name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The dc command arrives with the kb-tools spec (Kiro lane). Until then this is a no-op.
      - run: pnpm run --if-present dc validate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Screenshots for the pull request: every static screen and gallery
      # section at 390, 768 and 1280 px, from e2e/evidence.spec.ts. Uploaded
      # even when a test fails, so a failure can be seen.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - run: pnpm build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
