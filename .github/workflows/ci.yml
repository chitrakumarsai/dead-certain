name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The apps import their compiled knowledge base, which is not committed.
      - run: pnpm dc build apps/claim-check
      - run: pnpm dc build apps/pre-flight
      # new-app:dc-build
      - run: pnpm check
      - run: pnpm dc validate
      - run: pnpm dc golden
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Screenshots for the pull request: every static screen and gallery
      # section at 390, 768 and 1280 px, from e2e/evidence.spec.ts. Uploaded
      # even when a test fails, so a failure can be seen.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - run: pnpm build
      # One Pages site: each app is served under the site at its own folder.
      - run: cp -R apps/claim-check/dist apps/site/dist/claim-check
      - run: cp -R apps/pre-flight/dist apps/site/dist/pre-flight
      # new-app:copy
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  # Proves the README's "Add a third app" commands work (app-template requirement 9).
  # It reads the commands from the README, so the README cannot drift from them.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Path filter (open question 7): on a pull request, run only when the
      # scaffold's inputs change. On main it always runs.
      - id: changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(scripts/|templates/|README\.md$|playwright\.config\.ts$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # A new workspace package changes pnpm-lock.yaml, which pnpm refuses under
      # CI=true. pnpm 10 ignores PNPM_CONFIG_FROZEN_LOCKFILE and user config
      # there, so this job writes a project .npmrc on the runner only. It is
      # never committed, and check keeps --frozen-lockfile.
      - if: steps.changes.outputs.run == 'true'
        run: echo "frozen-lockfile=false" >> .npmrc
      # shell: bash adds -o pipefail, so a missing README block fails the step.
      - if: steps.changes.outputs.run == 'true'
        shell: bash
        run: node --experimental-strip-types scripts/readme-block.ts ci-probe | sh -e
      # The apps import their compiled knowledge base, which is not committed.
      - if: steps.changes.outputs.run == 'true'
        run: pnpm dc validate && pnpm dc golden && pnpm dc build
      - if: steps.changes.outputs.run == 'true'
        run: pnpm check && pnpm build
      - if: steps.changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.changes.outputs.run == 'true'
        run: pnpm exec playwright test --project=1280 --project=reduced-motion e2e/ci-probe-smoke.spec.ts

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
