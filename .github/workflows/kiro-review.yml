name: Kiro review
on: [pull_request]

jobs:
  review:
    # Secrets are not passed to pull requests from forks, so review only branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash
      - name: Write the diff
        run: git diff origin/${{ github.base_ref }}...HEAD > pr.diff
      - name: Review against the specs
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: >
          kiro-cli chat --v3 --no-interactive --trust-tools=read_file,grep_search
          "Read pr.diff. Review those changes against the specs in .kiro/specs and
          the steering in .kiro/steering. List each violation with its file and line."
